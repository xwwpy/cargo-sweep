<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f5f7" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta
      name="description"
      content="Cargo Sweep — 发现并清理 Rust target 构建缓存，安全回收磁盘空间。"
    />
    <title>Cargo Sweep · Rust Target 清理器</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("cargo-sweep.theme") || "system";
          var dark =
            mode === "dark" ||
            (mode !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
          }
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          /* Theme defaults to light when storage is unavailable. */
        }
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
