[package]
name = "cargo-sweep"
version = "0.7.2"
description = "Discover and reclaim disk space used by Rust Cargo target directories"
authors = ["Cargo Sweep"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "cargo_sweep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "7"
dunce = "1"
rayon = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "charset", "native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
toml = "0.8"
toml_edit = "0.22"
walkdir = "2.5"

[target.'cfg(windows)'.dependencies]
junction = "1"

[dev-dependencies]
tempfile = "3"
