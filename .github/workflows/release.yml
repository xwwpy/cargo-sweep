name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare latest-only release notes
        id: release_notes
        shell: pwsh
        run: |
          node scripts/release-notes.mjs
          $body = (Get-Content -LiteralPath .release-notes.md -Raw -Encoding UTF8).TrimEnd()
          $marker = "RELEASE_NOTES_" + [guid]::NewGuid().ToString("N")
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "body<<$marker"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value $body
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value $marker

      - name: Build and publish Windows release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: Cargo Sweep v__VERSION__
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --bundles nsis

      - name: Package portable and installer wrapper
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Upload Windows wrapper assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $tag = "v$version"
          Get-ChildItem release -Filter "*.zip" | ForEach-Object {
            gh release upload $tag $_.FullName --clobber
          }
          if (Test-Path "src-tauri/target/release/bundle/nsis/*.exe.sig") {
            Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe.sig" | ForEach-Object {
              gh release upload $tag $_.FullName --clobber
            }
          }

  macos:
    needs: windows
    runs-on: macos-14
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add universal macOS targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build universal macOS DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Upload macOS DMG and updater assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v$VERSION"
          BUNDLE="src-tauri/target/universal-apple-darwin/release/bundle"
          mkdir -p release/macos

          DMG=$(find "$BUNDLE" -type f -name '*.dmg' | head -n 1)
          if [ -z "$DMG" ]; then
            echo "macOS DMG was not produced"
            exit 1
          fi
          cp "$DMG" "release/macos/Cargo-Sweep-${VERSION}-universal.dmg"
          gh release upload "$TAG" "release/macos/Cargo-Sweep-${VERSION}-universal.dmg" --clobber

          APP_ARCHIVE=$(find "$BUNDLE" -type f -name '*.app.tar.gz' | head -n 1)
          APP_SIGNATURE=$(find "$BUNDLE" -type f -name '*.app.tar.gz.sig' | head -n 1)
          if [ -z "$APP_ARCHIVE" ] || [ -z "$APP_SIGNATURE" ]; then
            echo "macOS updater archive or signature was not produced"
            find "$BUNDLE" -maxdepth 3 -type f | sort
            exit 1
          fi
          gh release upload "$TAG" "$APP_ARCHIVE" "$APP_SIGNATURE" --clobber

  linux:
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux DEB and AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm tauri build --bundles deb,appimage

      - name: Upload Linux DEB and updater assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v$VERSION"
          BUNDLE="src-tauri/target/release/bundle"
          mkdir -p release/linux

          DEB=$(find "$BUNDLE/deb" -type f -name '*.deb' | head -n 1)
          DEB_SIGNATURE=$(find "$BUNDLE/deb" -type f -name '*.deb.sig' | head -n 1)
          APPIMAGE=$(find "$BUNDLE/appimage" -type f -name '*.AppImage' | head -n 1)
          APPIMAGE_SIGNATURE=$(find "$BUNDLE/appimage" -type f -name '*.AppImage.sig' | head -n 1)

          if [ -z "$DEB" ] || [ -z "$DEB_SIGNATURE" ] || [ -z "$APPIMAGE" ] || [ -z "$APPIMAGE_SIGNATURE" ]; then
            echo "Linux DEB or AppImage artifacts were not produced"
            find "$BUNDLE" -maxdepth 3 -type f | sort
            exit 1
          fi

          cp "$DEB" "release/linux/Cargo-Sweep-${VERSION}-amd64.deb"
          cp "$DEB_SIGNATURE" "release/linux/Cargo-Sweep-${VERSION}-amd64.deb.sig"
          cp "$APPIMAGE" "release/linux/Cargo-Sweep-${VERSION}-amd64.AppImage"
          cp "$APPIMAGE_SIGNATURE" "release/linux/Cargo-Sweep-${VERSION}-amd64.AppImage.sig"
          gh release upload "$TAG" \
            "release/linux/Cargo-Sweep-${VERSION}-amd64.deb" \
            "release/linux/Cargo-Sweep-${VERSION}-amd64.deb.sig" \
            "release/linux/Cargo-Sweep-${VERSION}-amd64.AppImage" \
            "release/linux/Cargo-Sweep-${VERSION}-amd64.AppImage.sig" \
            --clobber

  manifest:
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate cross-platform updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-latest-json.mjs

      - name: Upload updater manifest and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release upload "v$VERSION" latest.json SHA256SUMS.txt --clobber
