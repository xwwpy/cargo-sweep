name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare latest-only release notes
        id: release_notes
        shell: pwsh
        run: |
          node scripts/release-notes.mjs
          $body = (Get-Content -LiteralPath .release-notes.md -Raw -Encoding UTF8).TrimEnd()
          $marker = "RELEASE_NOTES_" + [guid]::NewGuid().ToString("N")
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "body<<$marker"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value $body
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value $marker

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: Cargo Sweep v__VERSION__
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis

      - name: Package portable and installer wrapper
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Upload additional release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $tag = "v$version"
          Get-ChildItem release -Filter "*.zip" | ForEach-Object {
            gh release upload $tag $_.FullName --clobber
          }
          gh release upload $tag release/SHA256SUMS.txt --clobber

      - name: Fix updater manifest encoding
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fix-updater-notes.mjs
